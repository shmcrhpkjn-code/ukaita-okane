<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 浮いたお金メモ</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;margin:0;background:#f7f7f7;color:#333}
.container{max-width:720px;margin:auto;padding:18px}h1{text-align:center;font-size:25px;margin:8px 0 18px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000012}
input,select,button{width:100%;padding:12px;margin-top:7px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{border:0;background:#333;color:white;font-weight:bold}button.sub{background:#777}button.danger{background:#d9534f}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.total{font-size:28px;font-weight:bold;text-align:center;margin:8px 0}
.small{font-size:13px;color:#777}.record{border-top:1px solid #eee;padding:13px 0}.record:first-child{border-top:0}
.record-title{font-weight:bold;font-size:17px}.saved{font-weight:bold;margin-top:5px}.badge{display:inline-block;background:#eee;border-radius:999px;padding:3px 9px;font-size:12px;margin-top:5px}
.code{font-size:25px;font-weight:bold;letter-spacing:3px;text-align:center;background:#f1f1f1;padding:12px;border-radius:10px;margin:8px 0}
.status{text-align:center;font-size:13px;color:#666;margin-top:8px}.hidden{display:none}@media(max-width:480px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>💰 浮いたお金メモ</h1>
<div class="card">
<h2>👥 グループ</h2>
<input id="nickname" placeholder="あなたの名前（例：かれん）">
<button onclick="saveNickname()">名前を保存</button>
<button class="sub" onclick="createGroup()">新しいグループを作る</button>
<input id="groupCodeInput" placeholder="友達からもらったグループコード">
<button class="sub" onclick="joinGroup()">グループに参加する</button>
<div id="groupArea" class="hidden"><div class="small">現在のグループコード</div><div id="groupCode" class="code"></div><div class="small" style="text-align:center">このコードを友達に送ってね！</div><div id="status" class="status">接続中…</div></div>
</div>
<div class="card">
<h2>📝 記録する</h2>
<input id="date" type="date"><input id="title" placeholder="何を節約した？">
<div class="row"><div><div class="small">予定していた金額</div><input id="planned" type="number" min="0" placeholder="1000"></div><div><div class="small">実際に使った金額</div><input id="actual" type="number" min="0" placeholder="500"></div></div>
<select id="category"><option value="食費">🍚 食費</option><option value="買い物">🛍️ 買い物</option><option value="交通費">🚃 交通費</option><option value="遊び">🎮 遊び</option><option value="その他">📦 その他</option></select>
<button onclick="addRecord()">記録を追加</button>
</div>
<div class="card"><h2>💰 グループ合計</h2><div id="total" class="total">¥0</div><div id="monthTotal" style="text-align:center">今月：¥0</div></div>
<div class="card"><h2>📋 記録一覧</h2><div id="records">グループに参加すると記録が表示されます。</div></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAMX9s9Azem-p7rbdZL945YHZWtDNDGm0w",authDomain:"uitaokane.firebaseapp.com",projectId:"uitaokane",storageBucket:"uitaokane.firebasestorage.app",messagingSenderId:"533113681449",appId:"1:533113681449:web:83ba4f2080b96bd318ce38",measurementId:"G-7LVXPFJHM3"};
const app=initializeApp(firebaseConfig),db=getDatabase(app);
let groupCode=localStorage.getItem("ukaitaGroupCode")||"",nickname=localStorage.getItem("ukaitaNickname")||"",unsubscribe=null;
const $=id=>document.getElementById(id);$("nickname").value=nickname;$("date").value=new Date().toISOString().slice(0,10);
function makeCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
window.saveNickname=()=>{nickname=$("nickname").value.trim();if(!nickname){alert("名前を入力してね！");return}localStorage.setItem("ukaitaNickname",nickname);alert("名前を保存したよ！")};
function showGroup(){if(!groupCode)return;$("groupArea").classList.remove("hidden");$("groupCode").textContent=groupCode;$("status").textContent="接続中…";if(unsubscribe)unsubscribe();const rr=ref(db,`groups/${groupCode}/records`);unsubscribe=onValue(rr,s=>{const d=s.val()||{};const list=Object.entries(d).map(([id,r])=>({id,...r})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render(list);$("status").textContent=`共有中：${list.length}件`},e=>{$("status").textContent="データベースに接続できませんでした";console.error(e)})}
window.createGroup=()=>{if(!$("nickname").value.trim()){alert("先に名前を入力してね！");return}saveNickname();groupCode=makeCode();localStorage.setItem("ukaitaGroupCode",groupCode);showGroup();alert("グループを作ったよ！コードを友達に送ってね！")};
window.joinGroup=()=>{const c=$("groupCodeInput").value.trim().toUpperCase();if(!c){alert("グループコードを入力してね！");return}if(!$("nickname").value.trim()){alert("先に名前を入力してね！");return}saveNickname();groupCode=c;localStorage.setItem("ukaitaGroupCode",groupCode);showGroup()};
window.addRecord=async()=>{if(!groupCode){alert("先にグループを作るか、参加してね！");return}nickname=$("nickname").value.trim();if(!nickname){alert("名前を入力してね！");return}const date=$("date").value,title=$("title").value.trim(),planned=Number($("planned").value),actual=Number($("actual").value),category=$("category").value;if(!date||!title||Number.isNaN(planned)||Number.isNaN(actual)){alert("必要なところを入力してね！");return}await push(ref(db,`groups/${groupCode}/records`),{date,title,planned,actual,saved:planned-actual,category,nickname,createdAt:Date.now()});$("title").value="";$("planned").value="";$("actual").value=""};
function render(list){let total=0,month=0,ym=new Date().toISOString().slice(0,7);list.forEach(r=>{total+=Number(r.saved)||0;if((r.date||"").slice(0,7)===ym)month+=Number(r.saved)||0});$("total").textContent="¥"+total.toLocaleString();$("monthTotal").textContent="今月：¥"+month.toLocaleString();if(!list.length){$("records").textContent="まだ記録がないよ。";return}$("records").innerHTML=list.map(r=>`<div class="record"><div class="record-title">${esc(r.title)}</div><div class="small">${esc(r.date)} ・ ${esc(r.nickname||"名前なし")}</div><span class="badge">${esc(r.category||"その他")}</span><div>予定 ¥${Number(r.planned).toLocaleString()} → 実際 ¥${Number(r.actual).toLocaleString()}</div><div class="saved">浮いた金額：¥${Number(r.saved).toLocaleString()}</div>${r.nickname===nickname?`<button class="danger" style="margin-top:8px;padding:8px" onclick="deleteRecord('${r.id}')">自分の記録を削除</button>`:""}</div>`).join("")}
window.deleteRecord=async id=>{if(confirm("この記録を削除する？"))await remove(ref(db,`groups/${groupCode}/records/${id}`))};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
if(groupCode)showGroup();
</script>
</body>
</html>
